<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Physics Tag Playground — stealthis</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700&family=Inter:wght@300;400&display=swap" rel="stylesheet" />
</head>
<body>

  <header class="head">
    <span class="kicker">MATTER.JS — RIGID BODY DOM</span>
    <h1>Toolbox, dropped.</h1>
    <p class="sub">Grab a tag and throw it. Everything obeys the engine.</p>
  </header>

  <div class="controls">
    <button class="ctrl" id="gravityBtn">Flip gravity</button>
    <button class="ctrl" id="shakeBtn">Shake</button>
  </div>

  <div class="arena" id="arena" aria-label="Draggable physics playground of skill tags">
    <span class="pill p-a">GSAP</span>
    <span class="pill p-b">Three.js</span>
    <span class="pill p-c">Lenis</span>
    <span class="pill p-a">WebGL</span>
    <span class="pill p-d">Shaders</span>
    <span class="pill p-b">Astro</span>
    <span class="pill p-c">React</span>
    <span class="pill p-a">TypeScript</span>
    <span class="pill p-d">Bun</span>
    <span class="pill p-b">Cloudflare</span>
    <span class="pill p-c">Tailwind</span>
    <span class="pill p-d">Figma</span>
    <span class="pill p-a">Blender</span>
    <span class="pill p-b">Node</span>
    <span class="pill p-c">Vite</span>
    <span class="pill p-d">Zod</span>
  </div>

  <footer class="foot">
    <span>Matter.js · DOM sync</span>
    <span>stealthis — web-animations</span>
  </footer>

  <!-- SCRIPTS -->
  <script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
