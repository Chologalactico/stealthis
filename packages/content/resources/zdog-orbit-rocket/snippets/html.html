<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zdog Orbit Rocket — stealthis</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Inter:wght@300;400&display=swap" rel="stylesheet" />
</head>
<body>

  <header class="head">
    <span class="kicker">ZDOG — ROUND, FLAT, DESIGNER-FRIENDLY 3D</span>
    <h1>Little Orbit</h1>
  </header>

  <main class="stage">
    <canvas id="zdog-canvas" width="900" height="900" aria-label="Rotatable illustration of a rocket orbiting a planet"></canvas>
  </main>

  <footer class="foot">
    <span class="hint">↻ Drag anywhere on the scene to spin it</span>
    <span class="meta">Zdog · canvas · stealthis</span>
  </footer>

  <!-- SCRIPTS -->
  <script src="https://unpkg.com/zdog@1.1.3/dist/zdog.dist.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
