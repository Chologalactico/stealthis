<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Liquid Glass Dynamic Island — stealthis</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <filter id="glass-distortion" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.008 0.012" numOctaves="2" seed="21" result="noise" />
        <feGaussianBlur in="noise" stdDeviation="2" result="soft" />
        <feDisplacementMap in="SourceGraphic" in2="soft" scale="60" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </defs>
  </svg>

  <div class="scene" style="--hue: 350">
    <div class="blobs" aria-hidden="true"><span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span></div>

    <!-- ── The Island ── -->
    <div class="island lg state-idle" id="island" role="status" aria-live="polite">
      <span class="lg-effect"></span><span class="lg-tint"></span><span class="lg-shine"></span>
      <div class="lg-content island-inner">

        <!-- music: compact chip -->
        <div class="panel panel-music-chip">
          <span class="mini-art" aria-hidden="true">♫</span>
          <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        </div>

        <!-- music: expanded card -->
        <div class="panel panel-music-full">
          <div class="mf-head" id="mfHead">
            <span class="mini-art big" aria-hidden="true">♫</span>
            <span class="mf-meta"><strong>Violet Static</strong><em>Nadir Fields</em></span>
            <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          </div>
          <div class="mf-controls">
            <button class="mf-btn" id="mfPrev" aria-label="Previous">⏮</button>
            <button class="mf-btn mf-play" id="mfPlay" aria-label="Pause">⏸</button>
            <button class="mf-btn" id="mfNext" aria-label="Next">⏭</button>
          </div>
        </div>

        <!-- timer chip -->
        <div class="panel panel-timer">
          <svg class="ring" viewBox="0 0 30 30" aria-hidden="true">
            <circle class="ring-bg" cx="15" cy="15" r="12"></circle>
            <circle class="ring-fg" id="ringFg" cx="15" cy="15" r="12"></circle>
          </svg>
          <span class="timer-label">Timer</span>
          <span class="timer-value" id="timerValue">1:00</span>
        </div>

      </div>
    </div>

    <main class="page">
      <span class="kicker">LIQUID GLASS — DYNAMIC ISLAND</span>
      <h1>Live Activities</h1>
      <p class="sub">Start an activity and watch the island morph. Tap the music chip to expand it.</p>
      <div class="triggers">
        <button class="trigger" id="musicBtn" type="button">▶ Play music</button>
        <button class="trigger" id="timerBtn" type="button">⏱ 60s timer</button>
        <button class="trigger" id="idleBtn" type="button">✕ Clear</button>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
