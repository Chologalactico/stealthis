<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Liquid Glass Spotlight Search — stealthis</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <filter id="glass-distortion" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.008 0.012" numOctaves="2" seed="29" result="noise" />
        <feGaussianBlur in="noise" stdDeviation="2" result="soft" />
        <feDisplacementMap in="SourceGraphic" in2="soft" scale="60" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </defs>
  </svg>

  <div class="scene" style="--hue: 225">
    <div class="blobs" aria-hidden="true"><span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span></div>

    <main class="page">
      <span class="kicker">LIQUID GLASS — SPOTLIGHT</span>
      <h1>Find anything</h1>
      <p class="sub">Press <kbd>⌘</kbd><kbd>K</kbd> (or the button) and just type.</p>
      <button class="summon" id="summonBtn" type="button">🔍 Open Spotlight</button>
    </main>

    <div class="overlay" id="overlay" hidden>
      <div class="overlay-backdrop" id="backdrop"></div>

      <section class="spotlight lg" role="dialog" aria-modal="true" aria-label="Search">
        <span class="lg-effect"></span><span class="lg-tint"></span><span class="lg-shine"></span>
        <div class="lg-content spot-inner">
          <div class="field">
            <span class="field-icon" aria-hidden="true">🔍</span>
            <input id="searchInput" type="search" placeholder="Search apps, actions, files…"
                   aria-label="Search" autocomplete="off" spellcheck="false" />
            <kbd class="field-esc">esc</kbd>
          </div>
          <div class="results" id="results" role="listbox" aria-label="Results"></div>
          <p class="no-results" id="noResults" hidden>No results — try "glass"</p>
        </div>
      </section>
    </div>

    <div class="toast lg" id="toast" role="status" aria-live="polite" hidden>
      <span class="lg-effect"></span><span class="lg-tint"></span><span class="lg-shine"></span>
      <span class="lg-content toast-text" id="toastText"></span>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
