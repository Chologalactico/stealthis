<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Liquid Glass Dock — stealthis</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <filter id="glass-distortion" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.008 0.012" numOctaves="2" seed="3" result="noise" />
        <feGaussianBlur in="noise" stdDeviation="2" result="soft" />
        <feDisplacementMap in="SourceGraphic" in2="soft" scale="60" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </defs>
  </svg>

  <div class="scene" style="--hue: 195">
    <div class="blobs" aria-hidden="true"><span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span></div>

    <header class="scene-head">
      <span class="kicker">LIQUID GLASS — DOCK</span>
      <h1>Sweep the shelf</h1>
      <p class="sub">Move across the dock for the fisheye. Click to launch, click again to quit.</p>
    </header>

    <div class="tooltip lg" id="tooltip" hidden>
      <span class="lg-effect"></span><span class="lg-tint"></span><span class="lg-shine"></span>
      <span class="lg-content" id="tooltipText"></span>
    </div>

    <nav class="dock lg" id="dock" aria-label="Dock">
      <span class="lg-effect"></span><span class="lg-tint"></span><span class="lg-shine"></span>
      <div class="lg-content dock-row" id="dockRow"></div>
    </nav>
  </div>

  <script src="script.js"></script>
</body>
</html>
