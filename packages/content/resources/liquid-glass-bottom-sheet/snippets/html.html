<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Liquid Glass Bottom Sheet — stealthis</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <filter id="glass-distortion" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.008 0.012" numOctaves="2" seed="13" result="noise" />
        <feGaussianBlur in="noise" stdDeviation="2" result="soft" />
        <feDisplacementMap in="SourceGraphic" in2="soft" scale="60" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </defs>
  </svg>

  <div class="scene" style="--hue: 170">
    <div class="blobs" aria-hidden="true"><span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span></div>

    <main class="page">
      <span class="kicker">LIQUID GLASS — BOTTOM SHEET</span>
      <h1>Nearby</h1>
      <p class="sub">Open the sheet and drag its grabber between the three detents. Flick to skip stops.</p>
      <button class="open-btn" id="openBtn" type="button">Show places</button>
    </main>

    <div class="backdrop" id="backdrop" hidden></div>

    <section class="sheet lg" id="sheet" role="dialog" aria-modal="true" aria-label="Nearby places" hidden>
      <span class="lg-effect"></span><span class="lg-tint"></span><span class="lg-shine"></span>
      <div class="lg-content sheet-inner">

        <header class="sheet-head" id="sheetHead">
          <span class="grabber" aria-hidden="true"></span>
          <div class="sheet-title-row">
            <h2>Nearby places</h2>
            <button class="close" id="closeBtn" type="button" aria-label="Close">✕</button>
          </div>
          <input class="sheet-search" type="search" placeholder="Search this area…" aria-label="Search places" />
        </header>

        <div class="sheet-body" id="sheetBody">
          <ul class="places" id="places"></ul>
        </div>

      </div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
