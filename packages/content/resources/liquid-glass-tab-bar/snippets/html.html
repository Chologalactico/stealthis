<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Liquid Glass Tab Bar — stealthis</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- SVG displacement filter: the "lensing" part of Liquid Glass -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <filter id="glass-distortion" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.008 0.012" numOctaves="2" seed="7" result="noise" />
        <feGaussianBlur in="noise" stdDeviation="2" result="soft" />
        <feDisplacementMap in="SourceGraphic" in2="soft" scale="70" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </defs>
  </svg>

  <div class="screen" id="screen" style="--hue: 210">

    <!-- ambient color behind the glass -->
    <div class="blobs" aria-hidden="true">
      <span class="blob b1"></span>
      <span class="blob b2"></span>
      <span class="blob b3"></span>
    </div>

    <!-- scrollable feed -->
    <main class="feed" id="feed">
      <header class="feed-head">
        <span class="feed-kicker">LIQUID GLASS — TAB BAR</span>
        <h1 id="feedTitle">Today</h1>
        <p class="feed-sub">Scroll down to minimize the bar. Switch tabs to see the jelly pill.</p>
      </header>

      <div class="cards" id="cards"></div>
      <p class="feed-end">— fin —</p>
    </main>

    <!-- ── Liquid Glass tab bar ── -->
    <nav class="tabbar lg" id="tabbar" aria-label="Main navigation">
      <span class="lg-effect" aria-hidden="true"></span>
      <span class="lg-tint" aria-hidden="true"></span>
      <span class="lg-shine" aria-hidden="true"></span>
      <div class="lg-content">
        <span class="pill" id="pill" aria-hidden="true"></span>

        <button class="tab is-active" data-title="Today" data-hue="210" aria-current="page">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5.5 10v9h13v-9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Today</span>
        </button>

        <button class="tab" data-title="Explore" data-hue="150">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="m15 9-1.8 4.2L9 15l1.8-4.2L15 9Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
          <span>Explore</span>
        </button>

        <button class="tab" data-title="Play" data-hue="280">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5L8 5.5Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
          <span>Play</span>
        </button>

        <button class="tab" data-title="Chats" data-hue="20">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v7a2.5 2.5 0 0 1-2.5 2.5H9l-5 4V6.5Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
          <span>Chats</span>
        </button>

        <button class="tab" data-title="You" data-hue="330">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M5 19.5c1.3-3 4-4.5 7-4.5s5.7 1.5 7 4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <span>You</span>
        </button>
      </div>
    </nav>

  </div>

  <script src="script.js"></script>
</body>
</html>
