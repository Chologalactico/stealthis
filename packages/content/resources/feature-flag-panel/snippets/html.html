<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feature Flag Panel — stealthis</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>

  <main class="panel">

    <header class="head">
      <div>
        <h1>Feature flags</h1>
        <p class="sub">Toggle features and roll them out gradually per environment.</p>
      </div>
      <button class="btn-ghost" id="pauseAllBtn" type="button">⏸ Pause all in <span id="pauseEnvName">production</span></button>
    </header>

    <div class="toolbar">
      <div class="tabs" role="tablist" aria-label="Environment">
        <button class="tab" data-env="dev" role="tab">Dev <span class="tab-count" data-count="dev"></span></button>
        <button class="tab" data-env="staging" role="tab">Staging <span class="tab-count" data-count="staging"></span></button>
        <button class="tab is-active" data-env="prod" role="tab" aria-selected="true">Production <span class="tab-count" data-count="prod"></span></button>
      </div>
      <input class="search" id="search" type="search" placeholder="Search flags, keys, tags…" aria-label="Search flags" />
    </div>

    <div class="list" id="flagList"></div>
    <p class="empty" id="emptyMsg" hidden>No flags match your search.</p>

    <div class="savebar" id="saveBar" hidden>
      <span id="dirtyCount">0 unsaved changes</span>
      <div class="savebar-actions">
        <button class="btn-ghost" id="discardBtn" type="button">Discard</button>
        <button class="btn-primary" id="saveBtn" type="button">Save changes</button>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

  </main>

  <script src="script.js"></script>
</body>
</html>
