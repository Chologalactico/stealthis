<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Liquid Glass Control Center — stealthis</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <filter id="glass-distortion" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.008 0.012" numOctaves="2" seed="5" result="noise" />
        <feGaussianBlur in="noise" stdDeviation="2" result="soft" />
        <feDisplacementMap in="SourceGraphic" in2="soft" scale="60" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </defs>
  </svg>

  <div class="scene" style="--hue: 215">
    <div class="blobs" aria-hidden="true"><span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span></div>

    <header class="scene-head">
      <span class="kicker">LIQUID GLASS — CONTROL CENTER</span>
      <h1>Quick Controls</h1>
    </header>

    <main class="cc" aria-label="Control center">

      <!-- connectivity cluster -->
      <section class="tile lg tile-conn" aria-label="Connectivity">
        <span class="lg-effect"></span><span class="lg-tint"></span><span class="lg-shine"></span>
        <div class="lg-content conn-grid">
          <button class="disc" data-label="Airplane" aria-pressed="false"><span>✈</span></button>
          <button class="disc is-on" data-label="Wi-Fi" aria-pressed="true"><span>〶</span></button>
          <button class="disc is-on" data-label="Bluetooth" aria-pressed="true"><span>ᛒ</span></button>
          <button class="disc" data-label="Cellular" aria-pressed="false"><span>▲</span></button>
        </div>
      </section>

      <!-- focus -->
      <section class="tile lg tile-focus" aria-label="Focus">
        <span class="lg-effect"></span><span class="lg-tint"></span><span class="lg-shine"></span>
        <button class="lg-content focus-btn" id="focusBtn" aria-pressed="false">
          <span class="focus-icon">☾</span>
          <span class="focus-text"><strong>Focus</strong><em id="focusState">Off</em></span>
        </button>
      </section>

      <!-- brightness -->
      <section class="tile lg tile-slider" aria-label="Brightness">
        <span class="lg-effect"></span><span class="lg-tint"></span><span class="lg-shine"></span>
        <div class="lg-content vslider" data-slider="brightness" role="slider" tabindex="0"
             aria-label="Brightness" aria-valuemin="0" aria-valuemax="100" aria-valuenow="70">
          <div class="vfill" style="height:70%"></div>
          <span class="vicon">☀</span>
        </div>
      </section>

      <!-- volume -->
      <section class="tile lg tile-slider" aria-label="Volume">
        <span class="lg-effect"></span><span class="lg-tint"></span><span class="lg-shine"></span>
        <div class="lg-content vslider" data-slider="volume" role="slider" tabindex="0"
             aria-label="Volume" aria-valuemin="0" aria-valuemax="100" aria-valuenow="45">
          <div class="vfill" style="height:45%"></div>
          <span class="vicon">🔊</span>
        </div>
      </section>

      <!-- utility row -->
      <section class="tile lg tile-utils" aria-label="Utilities">
        <span class="lg-effect"></span><span class="lg-tint"></span><span class="lg-shine"></span>
        <div class="lg-content utils-row">
          <button class="disc" data-label="Flashlight" aria-pressed="false"><span>🔦</span></button>
          <button class="disc" data-label="Timer" aria-pressed="false"><span>⏱</span></button>
          <button class="disc" data-label="Calculator" aria-pressed="false"><span>🧮</span></button>
          <button class="disc" data-label="Camera" aria-pressed="false"><span>📷</span></button>
        </div>
      </section>

    </main>

    <p class="status" id="status" role="status" aria-live="polite">Drag the tall tiles · tap the discs</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
