<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Liquid Glass Notification Stack — stealthis</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <filter id="glass-distortion" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.008 0.012" numOctaves="2" seed="9" result="noise" />
        <feGaussianBlur in="noise" stdDeviation="2" result="soft" />
        <feDisplacementMap in="SourceGraphic" in2="soft" scale="60" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </defs>
  </svg>

  <div class="scene" style="--hue: 250">
    <div class="blobs" aria-hidden="true"><span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span></div>

    <header class="scene-head">
      <span class="clock" id="clock">9:41</span>
      <span class="date">Sunday, July 5</span>
    </header>

    <section class="stack-zone">
      <header class="group-head" id="groupHead" hidden>
        <span id="groupCount">4 notifications</span>
        <span class="group-actions">
          <button class="chip" id="lessBtn" type="button">Show less</button>
          <button class="chip" id="clearBtn" type="button">Clear all</button>
        </span>
      </header>

      <div class="stack" id="stack" aria-label="Notifications"></div>

      <div class="empty lg" id="empty" hidden>
        <span class="lg-effect"></span><span class="lg-tint"></span><span class="lg-shine"></span>
        <div class="lg-content empty-inner">
          <strong>No notifications</strong>
          <button class="chip" id="restoreBtn" type="button">Restore demo</button>
        </div>
      </div>
    </section>

    <p class="hint">Tap the pile to expand · drag a card sideways to dismiss</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
