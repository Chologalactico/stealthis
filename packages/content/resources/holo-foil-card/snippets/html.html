<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Holographic Foil Trading Card — stealthis</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
</head>
<body>

  <div class="stage-glow" aria-hidden="true"></div>
  <canvas id="webgl" aria-label="Interactive holographic trading card"></canvas>

  <header class="hud hud-top">
    <span class="hud-kicker">STEALTHIS ARCHIVE — SET 07</span>
    <h1>HOLO&nbsp;FOIL</h1>
  </header>

  <footer class="hud hud-bottom">
    <span class="hud-hint" id="hint">Move to tilt · Click to flip</span>
    <span class="hud-meta">Three.js · custom GLSL · GSAP</span>
  </footer>

  <!-- SCRIPTS -->
  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
