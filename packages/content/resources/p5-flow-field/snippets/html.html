<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>p5.js Flow Field Painter — stealthis</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@300;400&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- p5 appends its canvas to <main> -->
  <main id="sketch" aria-label="Generative flow field artwork. Click to regenerate."></main>

  <header class="hud hud-top">
    <span class="hud-kicker">P5.JS — CREATIVE CODING</span>
    <h1>Flow Field N°<span id="seedNo">001</span></h1>
  </header>

  <footer class="hud hud-bottom">
    <div class="hud-buttons">
      <button class="ctrl" id="seedBtn">New seed</button>
      <button class="ctrl" id="paletteBtn">Palette — <span id="palName">Ember</span></button>
    </div>
    <span class="hud-hint">Click the canvas to regenerate</span>
  </footer>

  <!-- SCRIPTS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
