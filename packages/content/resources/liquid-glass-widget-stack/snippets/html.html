<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Liquid Glass Widget Stack — stealthis</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <filter id="glass-distortion" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.008 0.012" numOctaves="2" seed="33" result="noise" />
        <feGaussianBlur in="noise" stdDeviation="2" result="soft" />
        <feDisplacementMap in="SourceGraphic" in2="soft" scale="60" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </defs>
  </svg>

  <div class="scene" id="scene" style="--hue: 205">
    <div class="blobs" aria-hidden="true"><span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span></div>

    <header class="scene-head">
      <span class="kicker">LIQUID GLASS — SMART STACK</span>
      <h1>Widget Stack</h1>
      <p class="sub">Swipe the widget vertically, tap a dot, or just wait.</p>
    </header>

    <div class="stack-wrap">
      <section class="widget lg" id="widget" aria-roledescription="carousel" aria-label="Widget stack">
        <span class="lg-effect"></span><span class="lg-tint"></span><span class="lg-shine"></span>
        <div class="lg-content faces" id="faces">

          <!-- Weather -->
          <div class="face" data-hue="205" role="group" aria-label="Weather">
            <div class="w-top">
              <span class="w-place">Medellín</span>
              <span class="w-icon" aria-hidden="true">⛅</span>
            </div>
            <div class="w-temp">23°</div>
            <div class="w-bottom">
              <span>Partly cloudy</span>
              <span>H:27° L:17°</span>
            </div>
          </div>

          <!-- Calendar -->
          <div class="face" data-hue="0" role="group" aria-label="Calendar">
            <div class="c-date"><em>SUNDAY</em><strong>5</strong></div>
            <ul class="c-events">
              <li><span class="c-bar" style="background:#f87171"></span><span class="c-text"><strong>Design review</strong><em>14:00 – 15:00</em></span></li>
              <li><span class="c-bar" style="background:#60a5fa"></span><span class="c-text"><strong>Ramen w/ Tomás</strong><em>19:30</em></span></li>
            </ul>
          </div>

          <!-- Battery -->
          <div class="face" data-hue="140" role="group" aria-label="Batteries">
            <div class="b-rings">
              <div class="b-item">
                <svg viewBox="0 0 44 44" class="b-ring"><circle class="b-bg" cx="22" cy="22" r="18"/><circle class="b-fg" cx="22" cy="22" r="18" style="--pct:0.76; stroke:#4ade80"/></svg>
                <span class="b-glyph" aria-hidden="true">📱</span>
                <span class="b-pct">76%</span>
              </div>
              <div class="b-item">
                <svg viewBox="0 0 44 44" class="b-ring"><circle class="b-bg" cx="22" cy="22" r="18"/><circle class="b-fg" cx="22" cy="22" r="18" style="--pct:0.31; stroke:#fbbf24"/></svg>
                <span class="b-glyph" aria-hidden="true">🎧</span>
                <span class="b-pct">31%</span>
              </div>
              <div class="b-item">
                <svg viewBox="0 0 44 44" class="b-ring"><circle class="b-bg" cx="22" cy="22" r="18"/><circle class="b-fg" cx="22" cy="22" r="18" style="--pct:0.92; stroke:#60a5fa"/></svg>
                <span class="b-glyph" aria-hidden="true">⌚</span>
                <span class="b-pct">92%</span>
              </div>
            </div>
            <span class="b-label">Batteries</span>
          </div>

        </div>
      </section>

      <div class="dots" id="dots" role="tablist" aria-label="Widgets"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
