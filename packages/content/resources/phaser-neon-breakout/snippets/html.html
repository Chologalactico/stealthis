<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phaser Neon Breakout — stealthis</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@300;400&display=swap" rel="stylesheet" />
</head>
<body>

  <header class="head">
    <span class="kicker">PHASER 3 — ZERO-ASSET ARCADE</span>
    <h1>NEON BREAKOUT</h1>
  </header>

  <main class="frame">
    <div id="game" aria-label="Playable breakout game. Move with the mouse or arrow keys, click or press space to launch."></div>
  </main>

  <footer class="foot">
    <span>Mouse / ← → to move · click or space to launch</span>
    <span class="meta">Phaser 3 · arcade physics · stealthis</span>
  </footer>

  <!-- SCRIPTS -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
